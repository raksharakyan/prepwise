# Supabase project config.
#
# project_id must match this project's reference, the short string in the
# dashboard URL: https://supabase.com/dashboard/project/<project_id>
# The GitHub integration reads this file to know which project to deploy to.
project_id = "hvseavmnyhwybklmqvvc"

# Both functions check the caller themselves, with Supabase Auth, inside the
# code. The platform's own JWT check stays off because it rejects the new
# sb_publishable_ keys outright, and because account's username check has to
# work before anyone has signed in.
[functions.gemini]
verify_jwt = false

[functions.account]
verify_jwt = false
